name: Backend JaCoCo coverage baseline

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/coverage_audit.py'
      - 'scripts/coverage_inventory.py'
      - 'scripts/test_results_audit.py'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: worktime_migration_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      WORKTIME_MYSQL_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:13307/worktime_migration_test?serverTimezone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and generate JaCoCo report
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport --no-daemon
      - name: Publish measured line and branch coverage
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('build/reports/jacoco/test/jacocoTestReport.xml')
          if not path.exists():
              print('Coverage XML not generated (test or report task may have failed)')
              raise SystemExit(1)
          root = ET.parse(path).getroot()
          output = ['## Backend JaCoCo coverage (measured)']
          for kind in ('LINE', 'BRANCH'):
              c = next((x for x in root.findall('counter') if x.attrib.get('type') == kind), None)
              if c is None:
                  output.append(f'- {kind}: not available')
                  continue
              covered = int(c.attrib['covered'])
              missed = int(c.attrib['missed'])
              total = covered + missed
              pct = 100 * covered / total if total else 0
              output.append(f'- {kind}: **{pct:.2f}%** ({covered}/{total})')
          print('\n'.join(output))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(output) + '\n')
          PY
      - name: Review every uncovered class and branch
        if: success()
        run: |
          python3 scripts/coverage_audit.py
          python3 scripts/coverage_inventory.py
          python3 scripts/test_results_audit.py
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage
          path: |
            build/reports/jacoco/test/
            build/reports/jacoco/coverage-audit.md
            build/reports/jacoco/coverage-inventory.json
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
