name: Worktime backend CI and staging deployment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: worktime
          MYSQL_USER: worktime
          MYSQL_PASSWORD: synthetic-ci-password
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s deploy -p "test_*.py"
      - name: Test and package
        run: bash gradlew test bootJar --no-daemon
      - name: Create isolated schedule test schema
        env:
          MYSQL_TEST_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_TEST_CONTAINER" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -u root' <<'SQL'
          CREATE DATABASE worktime_schedule_test;
          GRANT ALL ON worktime_schedule_test.* TO 'worktime'@'%';
          SQL
      - name: MySQL schedule concurrency acceptance
        env:
          WORKTIME_SCHEDULE_TEST_URL: jdbc:mysql://127.0.0.1:3306/worktime_schedule_test?serverTimezone=UTC
        run: bash gradlew test --tests com.worktime.ConcurrentScheduleIntegrationTest --tests com.worktime.WorkLogCorrectionIntegrationTest --rerun-tasks --no-daemon
      - name: MySQL Flyway startup check
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/worktime
          SPRING_DATASOURCE_USERNAME: worktime
          SPRING_DATASOURCE_PASSWORD: synthetic-ci-password
          JWT_SECRET: synthetic-ci-only-jwt-secret-at-least-32-bytes-long
          SPRING_FLYWAY_BASELINE_ON_MIGRATE: 'false'
        run: |
          java -jar build/libs/*-SNAPSHOT.jar > startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then ready=true; break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          test "$ready" = true
          expected=$(python3 deploy/migrations.py --count)
          docker exec "${{ job.services.mysql.id }}" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root worktime -N -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1"' | grep -qx "$expected"
      - name: Build image
        run: docker build -f deploy/Dockerfile -t worktime-backend:${{ github.sha }} .
      - name: Package deploy image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICE: backend
        run: |
          docker save worktime-backend:${{ github.sha }} | gzip > image.tar.gz
          python3 deploy/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: backend-${{ github.sha }}
          path: |
            image.tar.gz
            metadata.json
          retention-days: 1
          if-no-files-found: error
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-${{ github.sha }}
      - name: Transfer and deploy exact CI artifact
        env:
          SERVICE: backend
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash deploy/upload.sh

