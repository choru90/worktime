name: Inspect Worktime V5 release prerequisites
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-v5.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Check release gate capabilities without exporting files
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          ssh -i "$key_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$key_dir/known_hosts" -o ConnectTimeout=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          root = Path("/opt/worktime")
          source = (root / "deploy.py").read_text()
          tree = ast.parse(source)
          def callname(n):
              if isinstance(n, ast.Name): return n.id
              if isinstance(n, ast.Attribute): return n.attr
              return ""
          deploy = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "deploy")
          gate = next(n for n in ast.walk(deploy) if isinstance(n, ast.Raise) and "migration change requires reviewed release" in ast.unparse(n))
          calls = [(n.lineno, callname(n.func)) for n in ast.walk(deploy) if isinstance(n, ast.Call)]
          print(json.dumps({
            "gate_matches": sum(isinstance(n, ast.Raise) and "migration change requires reviewed release" in ast.unparse(n) for n in ast.walk(tree)),
            "backup_called_after_gate": any(line > gate.lineno and "backup" in name.lower() for line, name in calls),
            "activation_called_after_gate": any(line > gate.lineno and name in ("run", "check_call", "check", "up", "activate", "compose", "apply") for line, name in calls),
            "backup_function_present": any(isinstance(n, ast.FunctionDef) and "backup" in n.name.lower() for n in ast.walk(tree)),
            "deploy_has_sha_argument": "sha" in [a.arg for a in deploy.args.args],
            "compose_file_present": (root / "compose.yml").is_file(),
            "runtime_credentials_exported": False
          }))
          def run(args, data=None):
              p = subprocess.run(args, input=data, text=True, capture_output=True, timeout=30, cwd=root)
              if p.returncode:
                  e=p.stderr.lower()
                  category = "permission" if "permission denied" in e else "missing_variable" if "variable" in e else "missing_file" if "no such file" in e else "docker_unavailable" if "daemon" in e else "other"
                  print(json.dumps({"precheck_failure_category":category,"command_stage":"compose_config" if "config" in args else "database_query","exit_code":p.returncode}))
                  raise RuntimeError("server precheck command failed; output suppressed")
              return p.stdout
          ids=run(["docker","ps","--format","{{.ID}}"]).split()
          if not ids: raise RuntimeError("no running containers")
          containers=json.loads(run(["docker","inspect"]+ids))
          mysql=[s for s in containers if "mysql" in s.get("Config",{}).get("Image","").lower() and (s.get("Config",{}).get("Labels",{}).get("com.docker.compose.project.working_dir")==str(root) or s.get("Config",{}).get("Labels",{}).get("com.docker.compose.service")=="mysql")]
          if len(mysql)!=1: raise RuntimeError("expected exactly one Worktime MySQL container")
          db_id=mysql[0]["Id"]
          sql = """SELECT version, success FROM flyway_schema_history ORDER BY installed_rank;
          SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='work_logs' AND COLUMN_NAME IN ('correction_count','correction_reason');
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='work_log_corrections';"""
          cmd = 'set -eu; if [ -n "${MYSQL_ROOT_PASSWORD_FILE:-}" ]; then export MYSQL_PWD="$(cat "$MYSQL_ROOT_PASSWORD_FILE")"; else export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; fi; exec mysql -u root --batch --skip-column-names "$MYSQL_DATABASE"'
          out=run(["docker","exec","-i",db_id,"sh","-c",cmd],sql)
          lines=out.strip().splitlines()
          print(json.dumps({"flyway_versions":[line.split("\t") for line in lines[:-2]],"v5_columns":int(lines[-2]),"v5_table":int(lines[-1]),"runtime_credentials_exported":False}))
          
          import gzip, hashlib, os, re, datetime
          EXPECTED_V4={"bfb996c0c85bf871f029616e5d74c0a6fb7e14b1f59e8c176fff660929c48fda","08c58a09391e2fb55407b09df642056986d09e2d6e5fd97d23d6cdde0ff5a286"}
          EXPECTED_V5="c276840a0438395c0f32e9844dcda29137c03a194df7212bb48462d34a14316d"
          assert [line.split("\t") for line in lines[:-2]] == [["1","1"],["2","1"],["3","1"],["4","1"],["5","1"]]
          assert int(lines[-2])==2 and int(lines[-1])==1
          scope={"root":root,"Path":Path}
          def path_eval(n):
              if isinstance(n,ast.Name) and n.id in scope:return scope[n.id]
              if isinstance(n,ast.Constant) and isinstance(n.value,str):return n.value
              if isinstance(n,ast.BinOp) and isinstance(n.op,ast.Div):
                  return path_eval(n.left)/path_eval(n.right)
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=="Path" and len(n.args)==1:return Path(path_eval(n.args[0]))
              raise ValueError("not a static path")
          for n in sorted((n for n in ast.walk(deploy) if isinstance(n,ast.Assign) and n.lineno<gate.lineno),key=lambda n:n.lineno):
              try:
                  value=path_eval(n.value)
                  if isinstance(value,Path):
                      for t in n.targets:
                          if isinstance(t,ast.Name):scope[t.id]=value
              except (ValueError,TypeError,KeyError):pass
          paths=set()
          for n in ast.walk(deploy):
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=="read_text" and n.lineno<=gate.lineno:
                  try:
                      p=path_eval(n.func.value)
                      if isinstance(p,Path) and p.is_file() and p.resolve().parent==root.resolve() and "migration" in p.name.lower():
                          paths.add(p)
                  except (ValueError,TypeError,KeyError,OSError):pass
          old=[p for p in paths if p.read_text().strip() in EXPECTED_V4]
          new=[p for p in paths if p.read_text().strip()==EXPECTED_V5]
          print(json.dumps({"recognized_migration_approval_files":len(paths),"v4_approval_files":len(old),"v5_approval_files":len(new),"runtime_credentials_exported":False}))
          PY
