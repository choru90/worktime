name: Inspect Worktime V5 release prerequisites
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-v5.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Apply specifically approved V5 release with verified backup
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          ssh -i "$key_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$key_dir/known_hosts" -o ConnectTimeout=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "WORKTIME_RELEASE_SHA=$GITHUB_SHA python3 -" <<'PY'
          import ast
          import contextlib
          import datetime
          import gzip
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.request
          
          ROOT = Path("/opt/worktime")
          TARGET = os.environ["WORKTIME_RELEASE_SHA"]
          EXPECTED_MIGRATIONS = "c276840a0438395c0f32e9844dcda29137c03a194df7212bb48462d34a14316d"
          GATE_MESSAGE = "migration change requires reviewed release"
          if len(TARGET) != 40 or any(c not in "0123456789abcdef" for c in TARGET):
              raise RuntimeError("invalid approved release identifier")
          
          def run(args, data=None, timeout=60):
              result = subprocess.run(args, input=data, text=True, capture_output=True, cwd=ROOT, timeout=timeout)
              if result.returncode:
                  raise RuntimeError("release command failed; sensitive output suppressed")
              return result.stdout
          
          def database():
              ids = run(["docker", "ps", "--format", "{{.ID}}"]).split()
              containers = json.loads(run(["docker", "inspect"] + ids))
              found = [c for c in containers
                       if "mysql" in c["Config"].get("Image", "").lower()
                       and (c["Config"].get("Labels", {}).get("com.docker.compose.project.working_dir") == str(ROOT) or c["Config"].get("Labels", {}).get("com.docker.compose.service") == "mysql")]
              if len(found) != 1:
                  raise RuntimeError("expected exactly one Worktime database")
              return found[0]["Id"]
          
          DB = database()
          AUTH = 'set -eu; if [ -n "${MYSQL_ROOT_PASSWORD_FILE:-}" ]; then export MYSQL_PWD="$(cat "$MYSQL_ROOT_PASSWORD_FILE")"; else export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; fi; '
          SQL = """SELECT version, success FROM flyway_schema_history ORDER BY installed_rank;
          SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='work_logs' AND COLUMN_NAME IN ('correction_count','correction_reason');
          SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='work_log_corrections';"""
          
          def state():
              out = run(["docker", "exec", "-i", DB, "sh", "-c",
                         AUTH + 'exec mysql -u root --batch --skip-column-names "$MYSQL_DATABASE"'], SQL)
              lines = out.strip().splitlines()
              return [line.split("\t") for line in lines[:-2]], int(lines[-2]), int(lines[-1])
          
          incoming = ROOT / "incoming" / "backend" / TARGET
          deadline = time.monotonic() + 600
          while not (incoming / "metadata.json").is_file() or not (incoming / "image.tar.gz").is_file():
              if time.monotonic() > deadline:
                  raise RuntimeError("verified CI release artifact did not arrive in time")
              time.sleep(5)
          meta = json.loads((incoming / "metadata.json").read_text())
          assert meta["service"] == "backend" and meta["sha"] == TARGET, "release identity mismatch"
          assert meta["migration_sha256"] == EXPECTED_MIGRATIONS, "unapproved migration set"
          with (incoming / "image.tar.gz").open("rb") as stream:
              archive_hash = hashlib.file_digest(stream, "sha256").hexdigest()
          assert archive_hash == meta["archive_sha256"], "release archive checksum mismatch"
          
          source = (ROOT / "deploy.py").read_text()
          tree = ast.parse(source)
          deploy_node = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == "deploy")
          gates = [n for n in ast.walk(deploy_node) if isinstance(n, ast.Raise)
                   and isinstance(n.exc, ast.Call)
                   and isinstance(n.exc.func, ast.Name) and n.exc.func.id == "RuntimeError"
                   and n.exc.args and isinstance(n.exc.args[0], ast.Constant)
                   and n.exc.args[0].value == GATE_MESSAGE]
          assert len(gates) == 1, "release gate structure changed"
          calls = [(n.lineno, n.func.id if isinstance(n.func, ast.Name) else "")
                   for n in ast.walk(deploy_node) if isinstance(n, ast.Call)]
          assert any(line > gates[0].lineno and "backup" in name.lower() for line, name in calls), "backup ordering changed"
          
          approval_used = False
          def approve_exact_v5():
              global approval_used
              assert not approval_used, "one-time approval already consumed"
              assert meta["sha"] == TARGET and meta["migration_sha256"] == EXPECTED_MIGRATIONS
              versions, columns, table = state()
              assert versions == [["1", "1"], ["2", "1"], ["3", "1"], ["4", "1"]], "database is not clean V4"
              assert columns == 0 and table == 0, "partial V5 must be reconciled"
              os.umask(0o077)
              folder = ROOT / "backups"
              folder.mkdir(mode=0o700, exist_ok=True)
              stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              backup = folder / ("reviewed-v5-" + stamp + "-" + TARGET[:12] + ".sql.gz")
              dump = AUTH + 'exec mysqldump -u root --single-transaction --quick --routines --triggers --events --hex-blob --no-tablespaces --set-gtid-purged=OFF --databases "$MYSQL_DATABASE"'
              proc = subprocess.Popen(["docker", "exec", DB, "sh", "-c", dump],
                                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, cwd=ROOT)
              with gzip.open(backup, "xb") as compressed:
                  while True:
                      block = proc.stdout.read(1024 * 1024)
                      if not block: break
                      compressed.write(block)
              proc.stdout.close()
              assert proc.wait(timeout=120) == 0, "database backup failed"
              uncompressed = 0
              with gzip.open(backup, "rb") as stream:
                  while True:
                      block = stream.read(1024 * 1024)
                      if not block: break
                      uncompressed += len(block)
              assert uncompressed > 0 and backup.stat().st_size > 0, "backup validation failed"
              with backup.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              backup.with_suffix(backup.suffix + ".sha256").write_text(digest + "\n")
              approval_used = True
              print(json.dumps({"approved_release_sha": TARGET, "backup_created": True,
                                "backup_gzip_verified": True, "backup_checksum_saved": True,
                                "runtime_credentials_exported": False}), flush=True)
          
          class ReviewedV5(ast.NodeTransformer):
              def visit_Raise(self, node):
                  if node is gates[0]:
                      return ast.copy_location(ast.Expr(value=ast.Call(func=ast.Name(id="approve_exact_v5", ctx=ast.Load()), args=[], keywords=[])), node)
                  return node
          
          tree = ast.fix_missing_locations(ReviewedV5().visit(tree))
          namespace = {"__name__": "worktime_reviewed_v5", "__file__": str(ROOT / "deploy.py"),
                       "approve_exact_v5": approve_exact_v5}
          captured = io.StringIO()
          try:
              with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
                  exec(compile(tree, str(ROOT / "deploy.py"), "exec"), namespace)
                  result = namespace["deploy"](ROOT, "backend", TARGET, incoming)
          except Exception:
              print(json.dumps({"deployment_completed": False, "reviewed_v5_approval_consumed": approval_used,
                                "sensitive_executor_output_suppressed": True}), flush=True)
              raise RuntimeError("reviewed release stopped; executor output retained only in server process") from None
          versions, columns, table = state()
          assert versions == [["1", "1"], ["2", "1"], ["3", "1"], ["4", "1"], ["5", "1"]], "V5 history verification failed"
          assert columns == 2 and table == 1, "V5 schema verification failed"
          ids = run(["docker", "ps", "--format", "{{.ID}}"]).split()
          containers = json.loads(run(["docker", "inspect"] + ids))
          apps = [c for c in containers if c["Config"].get("Image", "").endswith(":" + TARGET)]
          assert len(apps) == 1 and apps[0]["State"]["Running"], "approved API image is not running"
          ports = apps[0]["NetworkSettings"].get("Ports", {}).get("8080/tcp")
          assert ports, "API health endpoint mapping unavailable"
          hostport = ports[0]["HostPort"]
          with urllib.request.urlopen("http://127.0.0.1:" + hostport + "/actuator/health", timeout=15) as response:
              health = json.load(response)
          assert health.get("status") == "UP", "API health verification failed"
          print(json.dumps({"deployment_completed": True, "approved_release_sha": TARGET,
                            "flyway_versions": versions, "v5_columns": columns, "v5_table": table,
                            "approved_api_image_running": True, "api_health_up": True,
                            "persistent_deployment_guard_unchanged": (ROOT / "deploy.py").read_text() == source,
                            "backup_created_and_verified": approval_used,
                            "runtime_credentials_exported": False}), flush=True)
          
          PY
