spring:
  application:
    name: worktime

  datasource:
    url: jdbc:mysql://localhost:3307/demo_db
    username: demo_user
    password: demo_password
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        generate_statistics: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000
    open-in-view: false
    defer-datasource-initialization: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: 8080

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-must-be-at-least-256-bits-long
  expiration: 86400000  # 24시간 (밀리초)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.worktime: DEBUG
    # Hibernate SQL 로깅
    org.hibernate.SQL: DEBUG
    # Hibernate 6.x 파라미터 바인딩 로깅
    org.hibernate.orm.jdbc.bind: TRACE
    # Hibernate 5.x 호환 (필요 시)
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

